name: laravel-app

services:
  app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: laravel-app-app-1
    volumes:
      - ./src/public:/var/www/public:ro
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - default
      - npm

  php:
    build:
      context: ./src
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: laravel-app-php-1
    volumes:
      - ./src/.env:/var/www/.env
      - adc_storage:/var/www/storage/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default

  db:
    image: mysql:8.0
    restart: unless-stopped
    container_name: laravel-app-db-1
    environment:
      MYSQL_DATABASE: adc_portal
      MYSQL_USER: adc_user
      MYSQL_PASSWORD_FILE: /run/secrets/dbpass
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/dbrootpass
    secrets:
      - dbpass
      - dbrootpass
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - adc_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default

secrets:
  dbpass:
    file: .dbpass
  dbrootpass:
    file: .dbrootpass

volumes:
  adc_db_data:
  adc_storage:

networks:
  default:
  npm:
    external: true
    name: nginx-proxy-manager_default
