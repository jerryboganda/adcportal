name: CI — Build, Test & Deliver

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds and tests run HERE (GitHub Actions), never on the production VPS.
# The built image is transferred to the VPS (file transfer only) — the VPS
# never runs docker build / composer / npm / tests.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, intl, bcmath, zip, exif, mbstring, xml, curl, pcntl, dom, fileinfo
          tools: composer
          coverage: none
      - name: Install dependencies (dev)
        run: composer install --no-interaction --prefer-dist --no-scripts
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          php artisan key:generate
          php artisan package:discover || true
      - name: Run test suite
        run: php artisan test --no-coverage

  # Browser E2E (booking funnel, forms). Informational gate for now — flip
  # continue-on-error to false once suites are stabilized against seeded data.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd, intl, bcmath, zip, exif, mbstring, xml, curl, pcntl, dom, fileinfo
          tools: composer
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-scripts
          npm ci
      - name: Build assets (Actions only per compute policy)
        run: npm run build
      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          php artisan key:generate
          php artisan migrate --force
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start application
        run: php artisan serve --host=127.0.0.1 --port=8000 &
      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000 >/dev/null && break || sleep 2
          done
      - name: Run Playwright suite
        run: npx playwright test --reporter=line
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jerryboganda/adcportal:latest
            ghcr.io/jerryboganda/adcportal:${{ github.sha }}
      - name: Deliver image to VPS (transfer only — no build on VPS)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          docker pull ghcr.io/jerryboganda/adcportal:latest
          docker save ghcr.io/jerryboganda/adcportal:latest | gzip > /tmp/adc.tar.gz
          scp -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null /tmp/adc.tar.gz root@185.252.233.186:/opt/docker/adc-portal/adc.tar.gz
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null root@185.252.233.186 "
            docker load < /opt/docker/adc-portal/adc.tar.gz && rm -f /opt/docker/adc-portal/adc.tar.gz
            cd /opt/docker/adc-portal && git fetch origin main && git reset --hard origin/main
            docker compose up -d
            for i in \$(seq 1 30); do docker exec adc-portal-mysql mysqladmin ping --silent && break; sleep 2; done
            docker exec adc-portal-app php artisan key:generate || true
            docker exec adc-portal-app php artisan package:discover || true
            docker exec adc-portal-app php artisan migrate --force
            docker exec adc-portal-app php artisan config:clear
            docker exec adc-portal-app php artisan route:clear
            docker exec adc-portal-app php artisan view:clear
            echo DELIVER_DONE
          "
