name: CI — Test, Build & Deliver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests run HERE (GitHub Actions) — never on the hosting box.
permissions:
  contents: read

jobs:
  api-tests:
    name: Backend — PHP feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: |
          set -o pipefail
          composer install --no-scripts --prefer-dist --no-interaction --no-progress 2>&1 | tee /tmp/composer.log || {
            tail -n 12 /tmp/composer.log | sed 's/^/::error::composer /'
            exit 1
          }

      - name: Bootstrap packages (package:discover)
        run: |
          set -o pipefail
          php artisan package:discover --ansi 2>&1 | tee /tmp/discover.log || {
            tail -n 15 /tmp/discover.log | sed 's/^/::error::discover /'
            exit 1
          }

      - name: Run API feature suite (auth, RBAC, tenant isolation, workflow, billing, inventory)
        run: |
          set -o pipefail
          # NOTE: no `|| echo` here — a failing suite MUST fail this step and
          # the job (the old swallow made the backend job unable to fail).
          php artisan test --testsuite=Feature 2>&1 | tee /tmp/phpunit.log

      # NOTE: GitHub publishes at most ~10 `::error::` annotations PER STEP.
      # Every diagnostic below therefore lives in its OWN step so it gets a
      # fresh annotation budget — a single fat step silently swallows all but
      # the first ten lines (which is exactly how a 500 stayed undiagnosed).

      - name: Failure detail — application log
        if: failure()
        run: |
          # Laravel reports every uncaught exception here: class, message and
          # the first stack frames. This is the fastest path to a 5xx cause.
          grep -aE "\.ERROR:" storage/logs/laravel.log 2>/dev/null | head -10 | cut -c1-900 | sed 's/^/::error::laravel /' || true

      - name: Failure detail — failing tests
        if: failure()
        run: |
          grep -aE "FAILED |ERRORS |Tests: " /tmp/phpunit.log | head -10 | cut -c1-300 | sed 's/^/::error::result /' || true

      - name: Failure detail — assertion lines
        if: failure()
        run: |
          # Line-numbered orientation: exactly where the failures sit.
          grep -anE "FAILED |ERRORS |Tests: |Failed asserting|Expected response|Exception|Error:|SQLSTATE" /tmp/phpunit.log | head -10 | cut -c1-400 | sed 's/^/::error::assert /' || true

      - name: Failure detail — phpunit warnings
        if: failure()
        run: |
          # PHPUnit reports unexpected output as a warning and only shows the
          # first line, which is usually the only clue — print it in full.
          grep -aE "! .*→" /tmp/phpunit.log | head -3 | cut -c1-900 | sed 's/^/::error::warn /' || true

      - name: Failure detail — tail 1/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '1,10p' | cut -c1-900 | sed 's/^/::error::t1 /' || true

      - name: Failure detail — tail 2/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '11,20p' | cut -c1-900 | sed 's/^/::error::t2 /' || true

      - name: Failure detail — tail 3/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '21,30p' | cut -c1-900 | sed 's/^/::error::t3 /' || true

      - name: Failure detail — tail 4/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '31,40p' | cut -c1-900 | sed 's/^/::error::t4 /' || true

      - name: Failure detail — tail 5/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '41,50p' | cut -c1-900 | sed 's/^/::error::t5 /' || true

  spa-build:
    name: Frontend — typecheck & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build SPA
        run: npm run build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E — real browser journey
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: public/

      - name: Prepare application (SQLite + seed)
        env:
          RIS_DEMO_MODE: 'true'
          RIS_DEMO_TENANT_CODE: DEMO-2026
          RIS_DEMO_ADMIN_EMAIL: admin@polytronx-e2e.test
          RIS_DEMO_PASSWORD: E2eDemo#2026
          RIS_SUPER_ADMIN_EMAIL: platform@polytronx-e2e.test
          RIS_SUPER_ADMIN_PASSWORD: Platform#E2e2026
        run: |
          set -o pipefail
          {
            # The repo ships no .env (by design). key:generate cannot CREATE
            # one, so provision it from the example first — otherwise the app
            # runs with an empty APP_KEY and the browser login flow can never
            # complete (CSRF/session cookies cannot be encrypted).
            php -r "file_exists('.env') || copy('.env.example', '.env');"
            sed -i 's|^APP_ENV=.*|APP_ENV=local|' .env
            sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
            sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
            # An empty DB_DATABASE= overrides SQLite's default path with "",
            # which fails with "unable to open database file" — drop it.
            sed -i '/^DB_DATABASE=/d' .env
            grep -q '^SANCTUM_STATEFUL_DOMAINS=' .env || echo 'SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000' >> .env
            sed -i 's|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000|' .env
            php artisan key:generate --force
            php artisan migrate --force
            php artisan db:seed --force
          } 2>&1 | tee /tmp/prepare.log

      - name: Prepare failure detail
        if: failure()
        run: |
          grep -aE "ERROR|Exception|Deprecated|at [A-Za-z]" /tmp/prepare.log 2>/dev/null | head -14 | sed 's/^/::error::prepare /' || true
          tail -n 20 /tmp/prepare.log 2>/dev/null | sed 's/^/::error::prepare-tail /' || true
          exit 1

      - name: Start Laravel (serves API + SPA on one origin)
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx playwright install chromium --with-deps

      - name: Run E2E specs
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_EMAIL: admin@polytronx-e2e.test
          E2E_PASSWORD: E2eDemo#2026
        run: |
          set -o pipefail
          # No `|| echo` — a failing E2E run MUST fail this step and the job.
          npx playwright test 2>&1 | tee /tmp/e2e.log

      - name: E2E failure detail (fresh annotation budget)
        if: failure()
        run: |
          grep -aE "passed|failed|✘" /tmp/e2e.log | head -12 | sed 's/^/::error::e2e-result /' || true
          grep -aE "Error:|Timed out|waiting for|locator" /tmp/e2e.log | head -14 | sed 's/^/::error::e2e-detail /' || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Deploy to production VPS (ris.polytronx.com)
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check deploy secrets present
        id: secrets
        env:
          HOST: ${{ secrets.VPS_SSH_HOST }}
          USER: ${{ secrets.VPS_SSH_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS SSH secrets not configured - skipping deploy step."
          fi

      - name: Pull the freshly published image and restart the stack
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_SSH_HOST }}
          USER: ${{ secrets.VPS_SSH_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -p "${PORT:-22}")

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "APP_PATH=${APP_PATH:-/opt/docker/adc-portal}" 'bash -se' <<'REMOTE'
            set -e
            cd "${APP_PATH}"

            # The GHCR 'latest' image for this commit was published by the
            # publish workflow; pull it, recreate the app container and let
            # the entrypoint apply pending migrations + refresh caches.
            docker compose pull app
            docker compose up -d app

            sleep 20
            docker logs adc-portal-app --since 2m 2>&1 | grep -iE 'migrat|error' | tail -8 || true
            curl -fsS http://127.0.0.1:8090/api/v1/health || true
            echo DEPLOY_DONE
          REMOTE
