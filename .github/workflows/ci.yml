name: CI — Test, Build & Deliver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests run HERE (GitHub Actions) — never on the hosting box.
permissions:
  contents: read

jobs:
  api-tests:
    name: Backend — PHP feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: |
          set -o pipefail
          composer install --no-scripts --prefer-dist --no-interaction --no-progress 2>&1 | tee /tmp/composer.log || {
            tail -n 12 /tmp/composer.log | sed 's/^/::error::composer /'
            exit 1
          }

      - name: Bootstrap packages (package:discover)
        run: |
          set -o pipefail
          php artisan package:discover --ansi 2>&1 | tee /tmp/discover.log || {
            tail -n 15 /tmp/discover.log | sed 's/^/::error::discover /'
            exit 1
          }

      - name: Run API feature suite (auth, RBAC, tenant isolation, workflow, billing, inventory)
        run: |
          set -o pipefail
          # NOTE: no `|| echo` here — a failing suite MUST fail this step and
          # the job (the old swallow made the backend job unable to fail).
          php artisan test --testsuite=Feature 2>&1 | tee /tmp/phpunit.log

      - name: Failure detail (fresh annotation budget)
        if: failure()
        run: |
          grep -aE "FAILED " /tmp/phpunit.log | head -14 | sed 's/^/::error::result /' || true
          grep -aA 10 "FAILED " /tmp/phpunit.log | grep -aE "BadMethodCall|Undefined array|Expected response|Failed asserting|SQLSTATE|RuntimeException|Error:|▕" | head -14 | sed 's/^/::error::detail /' || true
          grep -a "BOOKING FAILED" /tmp/phpunit.log | head -2 | cut -c1-1500 | sed 's/^/::error::booking /' || true
          grep -a "BOOKING-RESPONSE" storage/logs/laravel.log 2>/dev/null | tail -1 | cut -c1-1500 | sed 's/^/::error::bookinglog /' || true
          grep -aE "\.ERROR:" storage/logs/laravel.log 2>/dev/null | grep -av BOOKING | tail -4 | cut -c1-1500 | sed 's/^/::error::laravel /' || true
          exit 1

  spa-build:
    name: Frontend — typecheck & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build SPA
        run: npm run build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E — real browser journey
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: public/

      - name: Prepare application (SQLite + seed)
        env:
          RIS_DEMO_MODE: 'true'
          RIS_DEMO_TENANT_CODE: DEMO-2026
          RIS_DEMO_ADMIN_EMAIL: admin@polytronx-e2e.test
          RIS_DEMO_PASSWORD: E2eDemo#2026
        run: |
          set -o pipefail
          {
            # The repo ships no .env (by design). key:generate cannot CREATE
            # one, so provision it from the example first — otherwise the app
            # runs with an empty APP_KEY and the browser login flow can never
            # complete (CSRF/session cookies cannot be encrypted).
            php -r "file_exists('.env') || copy('.env.example', '.env');"
            sed -i 's|^APP_ENV=.*|APP_ENV=local|' .env
            sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
            sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
            # An empty DB_DATABASE= overrides SQLite's default path with "",
            # which fails with "unable to open database file" — drop it.
            sed -i '/^DB_DATABASE=/d' .env
            grep -q '^SANCTUM_STATEFUL_DOMAINS=' .env || echo 'SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000' >> .env
            sed -i 's|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000|' .env
            php artisan key:generate --force
            php artisan migrate --force
            php artisan db:seed --force
          } 2>&1 | tee /tmp/prepare.log

      - name: Prepare failure detail
        if: failure()
        run: |
          grep -aE "ERROR|Exception|Deprecated|at [A-Za-z]" /tmp/prepare.log 2>/dev/null | head -14 | sed 's/^/::error::prepare /' || true
          tail -n 20 /tmp/prepare.log 2>/dev/null | sed 's/^/::error::prepare-tail /' || true
          exit 1

      - name: Start Laravel (serves API + SPA on one origin)
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npx playwright install chromium --with-deps

      - name: Run E2E specs
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_EMAIL: admin@polytronx-e2e.test
          E2E_PASSWORD: E2eDemo#2026
        run: |
          set -o pipefail
          # No `|| echo` — a failing E2E run MUST fail this step and the job.
          npx playwright test 2>&1 | tee /tmp/e2e.log

      - name: E2E failure detail (fresh annotation budget)
        if: failure()
        run: |
          grep -aE "passed|failed|✘" /tmp/e2e.log | head -12 | sed 's/^/::error::e2e-result /' || true
          grep -aE "Error:|Timed out|waiting for|locator" /tmp/e2e.log | head -14 | sed 's/^/::error::e2e-detail /' || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    name: Deliver to Hostinger (transfer + light commands only)
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: dist/

      - name: Check deploy secrets present
        id: secrets
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hostinger SSH secrets not configured — skipping deploy step."
          fi

      - name: Deploy SPA bundle + run lightweight release commands
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          USER: ${{ secrets.HOSTINGER_SSH_USER }}
          PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -p "${PORT:-22}")

          # Upload the compiled SPA into public/ (index.html + assets/)
          tar -C dist -czf /tmp/spa.tar.gz .
          scp "${SSH_OPTS[@]}" /tmp/spa.tar.gz "$USER@$HOST:/tmp/polytronx-ris-spa.tar.gz"

          # NOTE: default server path stays ~/adcportal until the GitHub repo is
          # renamed to polytronx-ris and the server re-cloned — then update here.
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "
            set -e
            cd \"\${APP_PATH:-\$HOME/adcportal}\"

            git pull --ff-only origin main

            # Replace the SPA bundle atomically
            rm -rf public/assets.bak
            [ -d public/assets ] && mv public/assets public/assets.bak || true
            tar -xzf /tmp/polytronx-ris-spa.tar.gz -C public/
            rm -f /tmp/polytronx-ris-spa.tar.gz
            [ -d public/assets.bak ] && rm -rf public/assets.bak || true

            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            echo DEPLOY_DONE
          "
