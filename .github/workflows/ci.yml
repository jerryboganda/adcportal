name: CI — Build, Test & Deliver

on:
  push:
    branches: [main]
  workflow_dispatch:

# Builds and tests run HERE (GitHub Actions), never on the production VPS.
# The built image is transferred to the VPS (file transfer only) — the VPS
# never runs docker build / composer / npm / tests.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build assets & verify bundle
        run: npm run build

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jerryboganda/adcportal:latest
            ghcr.io/jerryboganda/adcportal:${{ github.sha }}
      - name: Deliver image to VPS (transfer only — no build on VPS)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          docker pull ghcr.io/jerryboganda/adcportal:latest
          docker save ghcr.io/jerryboganda/adcportal:latest | gzip > /tmp/adc.tar.gz
          scp -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null /tmp/adc.tar.gz root@185.252.233.186:/opt/docker/adc-portal/adc.tar.gz
          ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null root@185.252.233.186 "
            docker load < /opt/docker/adc-portal/adc.tar.gz && rm -f /opt/docker/adc-portal/adc.tar.gz
            cd /opt/docker/adc-portal && git fetch origin main && git reset --hard origin/main
            docker compose up -d
            echo DELIVER_DONE
          "

