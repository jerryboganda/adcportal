name: CI â€” Test, Build & Deliver

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Builds and tests run HERE (GitHub Actions) â€” never on the hosting box.
permissions:
  contents: read

jobs:
  api-tests:
    name: Backend â€” PHP feature tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: |
          set -o pipefail
          composer install --no-scripts --prefer-dist --no-interaction --no-progress 2>&1 | tee /tmp/composer.log || {
            tail -n 12 /tmp/composer.log | sed 's/^/::error::composer /'
            exit 1
          }

      - name: Bootstrap packages (package:discover)
        run: |
          set -o pipefail
          php artisan package:discover --ansi 2>&1 | tee /tmp/discover.log || {
            tail -n 15 /tmp/discover.log | sed 's/^/::error::discover /'
            exit 1
          }

      - name: Run API suite (auth, RBAC, tenant isolation, workflow, billing, inventory, reporting)
        run: |
          set -o pipefail
          # NOTE: no `|| echo` here â€” a failing suite MUST fail this step and
          # the job (the old swallow made the backend job unable to fail).
          # Unit is included explicitly: it holds the pure-logic tests (age
          # bands, structured-report rendering, booking money) that the Feature
          # suite only reaches through the API.
          php artisan test --testsuite=Feature,Unit 2>&1 | tee /tmp/phpunit.log

      # NOTE: GitHub publishes at most ~10 `::error::` annotations PER STEP.
      # Every diagnostic below therefore lives in its OWN step so it gets a
      # fresh annotation budget â€” a single fat step silently swallows all but
      # the first ten lines (which is exactly how a 500 stayed undiagnosed).

      - name: Failure detail â€” application log
        if: failure()
        run: |
          # Laravel reports every uncaught exception here: class, message and
          # the first stack frames. This is the fastest path to a 5xx cause.
          grep -aE "\.ERROR:" storage/logs/laravel.log 2>/dev/null | head -10 | cut -c1-900 | sed 's/^/::error::laravel /' || true

      - name: Failure detail â€” failing tests
        if: failure()
        run: |
          grep -aE "FAILED |ERRORS |Tests: " /tmp/phpunit.log | head -10 | cut -c1-300 | sed 's/^/::error::result /' || true

      - name: Failure detail â€” assertion lines
        if: failure()
        run: |
          # Line-numbered orientation: exactly where the failures sit.
          grep -anE "FAILED |ERRORS |Tests: |Failed asserting|Expected response|Exception|Error:|SQLSTATE" /tmp/phpunit.log | head -10 | cut -c1-400 | sed 's/^/::error::assert /' || true

      - name: Failure detail â€” phpunit warnings
        if: failure()
        run: |
          # PHPUnit reports unexpected output as a warning and only shows the
          # first line, which is usually the only clue â€” print it in full.
          grep -aE "! .*â†’" /tmp/phpunit.log | head -3 | cut -c1-900 | sed 's/^/::error::warn /' || true

      - name: Failure detail â€” tail 1/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '1,10p' | cut -c1-900 | sed 's/^/::error::t1 /' || true

      - name: Failure detail â€” tail 2/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '11,20p' | cut -c1-900 | sed 's/^/::error::t2 /' || true

      - name: Failure detail â€” tail 3/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '21,30p' | cut -c1-900 | sed 's/^/::error::t3 /' || true

      - name: Failure detail â€” tail 4/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '31,40p' | cut -c1-900 | sed 's/^/::error::t4 /' || true

      - name: Failure detail â€” tail 5/5
        if: failure()
        run: tail -n 50 /tmp/phpunit.log | sed -n '41,50p' | cut -c1-900 | sed 's/^/::error::t5 /' || true

  api-tests-postgres:
    # The engine parity job. Production runs PostgreSQL (17) while the fast
    # suite above runs SQLite, and the two disagree in ways that cost real
    # outages: SQLite silently ignores `SELECT â€¦ FOR UPDATE` on an aggregate
    # (PostgreSQL rejects it with SQLSTATE[0A000]), so a booking allocator that
    # 500'd every production booking stayed green here. Anything touching
    # booking money, tokens or tenancy must therefore also pass on PostgreSQL
    # BEFORE a release can deploy.
    name: Backend â€” booking & billing suites on PostgreSQL (prod dialect)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ris
          POSTGRES_PASSWORD: ris
          POSTGRES_DB: ris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ris -d ris_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ris_test
      DB_USERNAME: ris
      DB_PASSWORD: ris

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-scripts --prefer-dist --no-interaction --no-progress

      - name: Bootstrap packages (package:discover)
        run: php artisan package:discover --ansi

      - name: Full suite on PostgreSQL
        run: |
          set -o pipefail
          # The SAME suite the SQLite job runs, on the engine production actually
          # uses. This used to be a hand-maintained --filter allowlist of 25
          # clinical/financial classes, which had silently rotted: all 30 tenancy,
          # RBAC, platform and lifecycle classes were excluded, so cross-tenant
          # leakage and authorization regressions were only ever proven against
          # SQLite. Its own comment said "widen once the rest of the suite is
          # proven dialect-clean" - the tests are now explicitly dialect-aware
          # (see TestCase, StudyTokenAllocatorTest, StudyTokenConcurrencyTest).
          #
          # Keep the SQLite job as the fast gate; this one exists to catch what
          # SQLite cannot express (row locks, FK enforcement, LIKE case
          # sensitivity, boolean and strict-mode coercion).
          #
          # No exclusions. The two that used to be carved out here were both the
          # same latent defect: a test addressing a row by a hardcoded id (role
          # 1, user 1) that SQLite resolves to "this tenant's row" and
          # PostgreSQL does not. Fixed at the source instead of filtered.
          php artisan test --testsuite=Feature,Unit 2>&1 | tee /tmp/phpunit-pg.log

      # GitHub publishes at most ~10 `::error::` annotations PER STEP, so the
      # summary and every failing test name get their own step (fresh budget)
      # BEFORE the error detail â€” a single fat grep silently hides all but the
      # first ten lines, which is exactly how the SQLSTATE below stayed
      # undiagnosed on the first run of this job.
      - name: Failure detail â€” PostgreSQL suite results
        if: failure()
        run: |
          grep -aE "^  Tests: |FAILED " /tmp/phpunit-pg.log | head -9 | cut -c1-380 | sed 's/^/::error::pg-result /' || true

      - name: Failure detail â€” PostgreSQL suite errors
        if: failure()
        run: |
          grep -aE "SQLSTATE|Failed asserting|Exception:" /tmp/phpunit-pg.log | head -7 | cut -c1-380 | sed 's/^/::error::pg-error /' || true
          grep -aE "\.ERROR:" storage/logs/laravel.log 2>/dev/null | head -2 | cut -c1-500 | sed 's/^::error::pg-log /' || true
          exit 1

  spa-build:
    name: Frontend â€” typecheck & production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build SPA
        run: npm run build

      - name: Upload SPA bundle
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E â€” real browser journey
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: public/

      - name: Prepare application (SQLite + seed)
        env:
          RIS_DEMO_MODE: 'true'
          RIS_DEMO_TENANT_CODE: DEMO-2026
          RIS_DEMO_ADMIN_EMAIL: admin@polytronx-e2e.test
          RIS_DEMO_PASSWORD: E2eDemo#2026
          RIS_SUPER_ADMIN_EMAIL: platform@polytronx-e2e.test
          RIS_SUPER_ADMIN_PASSWORD: Platform#E2e2026
        run: |
          set -o pipefail
          {
            # The repo ships no .env (by design). key:generate cannot CREATE
            # one, so provision it from the example first â€” otherwise the app
            # runs with an empty APP_KEY and the browser login flow can never
            # complete (CSRF/session cookies cannot be encrypted).
            php -r "file_exists('.env') || copy('.env.example', '.env');"
            sed -i 's|^APP_ENV=.*|APP_ENV=local|' .env
            sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
            sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
            # An empty DB_DATABASE= overrides SQLite's default path with "",
            # which fails with "unable to open database file" â€” drop it.
            sed -i '/^DB_DATABASE=/d' .env
            grep -q '^SANCTUM_STATEFUL_DOMAINS=' .env || echo 'SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000' >> .env
            sed -i 's|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000|' .env
            php artisan key:generate --force
            php artisan migrate --force
            php artisan db:seed --force
          } 2>&1 | tee /tmp/prepare.log

      - name: Prepare failure detail
        if: failure()
        run: |
          grep -aE "ERROR|Exception|Deprecated|at [A-Za-z]" /tmp/prepare.log 2>/dev/null | head -14 | sed 's/^/::error::prepare /' || true
          tail -n 20 /tmp/prepare.log 2>/dev/null | sed 's/^/::error::prepare-tail /' || true
          exit 1

      - name: Start Laravel (serves API + SPA on one origin)
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium --with-deps

      - name: Run E2E specs
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_EMAIL: admin@polytronx-e2e.test
          E2E_PASSWORD: E2eDemo#2026
        run: |
          set -o pipefail
          # No `|| echo` â€” a failing E2E run MUST fail this step and the job.
          npx playwright test 2>&1 | tee /tmp/e2e.log

      - name: E2E failure detail (fresh annotation budget)
        if: failure()
        run: |
          grep -aE "passed|failed|âœ˜" /tmp/e2e.log | head -12 | sed 's/^/::error::e2e-result /' || true
          grep -aE "Error:|Timed out|waiting for|locator" /tmp/e2e.log | head -14 | sed 's/^/::error::e2e-detail /' || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  print-visual:
    # Printing is verified against a REAL browser and a REAL renderer per browser
    # engine: paper geometry, print-media CSS, calibration, PDF page size, and the
    # PDF compared to the page the browser actually laid out. The server-side PDF
    # engine is asserted to be Chromium (the pixel-true path) â€” a silent fallback
    # to another renderer is a FAILURE here, because that is exactly the drift
    # that reaches paper unnoticed.
    name: Print â€” visual regression & PDF page QA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [api-tests, spa-build]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, msedge]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, fileinfo, curl, openssl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install PDF rasteriser (poppler)
        # The PDF is rendered BACK TO PIXELS so its paper can be compared with the
        # browser's own measurement. "A file exists" is not proof of a layout.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Download SPA bundle
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: public/

      - name: Prepare application (SQLite + seed)
        env:
          RIS_DEMO_MODE: 'true'
          RIS_DEMO_TENANT_CODE: DEMO-2026
          RIS_DEMO_ADMIN_EMAIL: admin@polytronx-e2e.test
          RIS_DEMO_PASSWORD: E2eDemo#2026
          RIS_SUPER_ADMIN_EMAIL: platform@polytronx-e2e.test
          RIS_SUPER_ADMIN_PASSWORD: Platform#E2e2026
        run: |
          set -o pipefail
          {
            php -r "file_exists('.env') || copy('.env.example', '.env');"
            sed -i 's|^APP_ENV=.*|APP_ENV=local|' .env
            sed -i 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' .env
            sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
            sed -i '/^DB_DATABASE=/d' .env
            grep -q '^SANCTUM_STATEFUL_DOMAINS=' .env || echo 'SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000' >> .env
            sed -i 's|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:3000,127.0.0.1:3000,localhost:8000,127.0.0.1:8000|' .env
            php artisan key:generate --force
            php artisan migrate --force
            php artisan db:seed --force
          } 2>&1 | tee /tmp/prepare-print.log

      - name: Start Laravel (API + SPA on one origin)
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers
        run: |
          npm ci --legacy-peer-deps
          npx playwright install chromium --with-deps

      - name: Install Microsoft Edge (second engine, same Chromium family)
        if: matrix.browser == 'msedge'
        run: |
          # Edge is a channel of Chromium with its own print/PDF pipeline, which is
          # why printing is verified on it rather than assumed from Chrome.
          npx playwright install msedge --with-deps || {
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
              | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" \
              | sudo tee /etc/apt/sources.list.d/microsoft-edge.list > /dev/null
            sudo apt-get update && sudo apt-get install -y microsoft-edge-stable
          }
          # A missing browser must fail HERE, with this message, not as a
          # confusing locator timeout three steps later.
          npx playwright install --list 2>/dev/null | grep -qi msedge || ls /usr/bin/microsoft-edge* >/dev/null

      - name: Report the resolved PDF engine (print:doctor)
        # Fails when a paper profile does not render at its physical size, and
        # prints WHY when the pixel-true engine is unavailable.
        run: php artisan print:doctor --render

      - name: Run print visual regression & parity suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_EMAIL: admin@polytronx-e2e.test
          E2E_PASSWORD: E2eDemo#2026
          E2E_BROWSERS: ${{ matrix.browser }}
          EXPECT_PRINT_DRIVER: chromium
        run: |
          set -o pipefail
          npx playwright test tests/print 2>&1 | tee /tmp/print-visual.log

      - name: Print visual failure detail (fresh annotation budget)
        if: failure()
        run: |
          grep -aE "passed|failed|âœ˜|engines used|expected|Received" /tmp/print-visual.log 2>/dev/null | head -14 | sed 's/^/::error::print /' || true
          exit 1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: print-visual-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The image is produced only from a commit whose whole matrix is green, so the
  # public `:latest` tag can never point at code the tests rejected. `deploy`
  # consumes this job, so the SHA it pulls was proven before it was shipped.
  publish:
    name: Publish image to GHCR
    needs: [api-tests, api-tests-postgres, spa-build, e2e, print-visual]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/publish.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to production VPS (ris.polytronx.com)
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    steps:
      - name: Check deploy secrets present
        id: secrets
        env:
          HOST: ${{ secrets.VPS_SSH_HOST }}
          USER: ${{ secrets.VPS_SSH_USER }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USER" ] && [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS SSH secrets not configured - skipping deploy step."
          fi

      - name: Pull the freshly published image and restart the stack
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.VPS_SSH_HOST }}
          USER: ${{ secrets.VPS_SSH_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_PATH: ${{ secrets.VPS_APP_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null -p "${PORT:-22}")

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "APP_PATH=${APP_PATH:-/opt/docker/adc-portal} GHCR_USER=${GHCR_USER} GHCR_TOKEN=${GHCR_TOKEN} IMAGE_TAG=${GITHUB_SHA}" 'bash -se' <<'REMOTE'
            set -e
            cd "${APP_PATH}"

            # Deploy the EXACT image this run built and tested (tag = commit
            # SHA), never the floating :latest â€” a publish that failed or
            # raced CI would otherwise redeploy an OLD image while the
            # pipeline reports green. The pull itself is the existence proof:
            # a SHA-tagged manifest can only be there if publish pushed it.
            IMAGE="ghcr.io/jerryboganda/adcportal:${IMAGE_TAG}"

            # A stored long-lived VPS credential can lapse and break every
            # future deploy. Authenticate each pull with the short-lived
            # workflow token â€” delivered through the SSH env (never a CLI
            # flag or the remote process list) and consumed via
            # --password-stdin (never echoed or logged), then cleared.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

            # Publish races this workflow on push, so retry a few times
            # before concluding the image is genuinely absent â€” and then
            # fail BEFORE the running app is touched.
            pulled=""
            for i in 1 2 3 4 5 6; do
              if docker pull "$IMAGE"; then pulled=1; break; fi
              echo "attempt $i: image not pullable yet â€” publish may still be running"; sleep 20
            done
            if [ -z "$pulled" ]; then
              echo "::error::Image $IMAGE not in registry after retries â€” publish failed; refusing to redeploy a stale :latest."
              exit 1
            fi

            # Retag the pinned image locally as :latest so the existing
            # compose file keeps working unchanged, then recreate. The
            # entrypoint applies pending migrations + refreshes caches.
            docker tag "$IMAGE" ghcr.io/jerryboganda/adcportal:latest
            docker compose up -d app

            sleep 20
            docker logs adc-portal-app --since 2m 2>&1 | grep -iE 'migrat|error' | tail -8 || true

            # ---- post-deploy smoke checks (failure fails the deploy) ----
            fail() { echo "::error::POST-DEPLOY SMOKE FAILED: $1"; exit 1; }

            # 1. Application health from the VPS itself (no public DNS).
            curl -fsS http://127.0.0.1:8090/api/v1/health | grep -q '"db":"ok"' \
              || fail "health endpoint missing or database check failed"

            # 2. Reporting and print routes exist and stay auth-gated (401, not 404).
            for path in /api/v1/reporting/worklist /api/v1/reporting/preferences /api/v1/print/registry /api/v1/settings/printing; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8090${path}")
              [ "$code" = "401" ] || fail "${path} answered ${code} (expected 401 â€” route missing or unguarded)"
            done

            # 2b. The shipped image can actually render documents â€” in the
            #     pixel-true engine. This is the one claim about printing that
            #     cannot be verified from the source tree: the browser binary,
            #     its system libraries and node all have to be present in THIS
            #     image, or every PDF silently degrades to a different renderer
            #     than the operator's print dialog.
            docker exec adc-portal-app php artisan print:doctor \
              | grep -q 'chromium available | yes' \
              || fail "the deployed image cannot render with Chromium (PDFs would not match the print dialog)"

            docker exec adc-portal-app php artisan print:doctor --render >/dev/null \
              || fail "a paper profile did not render at its physical size in the deployed image"

            # 3. The running container is the image this deploy shipped.
            running=$(docker inspect adc-portal-app --format '{{.Image}}')
            shipped=$(docker inspect "$IMAGE" --format '{{.Id}}')
            [ "$running" = "$shipped" ] || fail "running container is not the deployed image"

            # 4. Public URL through Cloudflare (soft: transient CF issues
            #    must not fail a deploy whose local checks passed).
            curl -fsS --max-time 15 https://ris.polytronx.com/api/v1/health >/dev/null \
              || echo "::warning::public health check soft-failed â€” local checks passed; investigate if it persists"
            echo DEPLOY_DONE
          REMOTE
