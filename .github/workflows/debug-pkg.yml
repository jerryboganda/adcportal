name: debug-pkg
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect package API visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== actor ==="; gh api /user --jq '.login' 2>&1
          echo "=== /user/packages (container) ==="; gh api "/user/packages?package_type=container" --jq '.[].name' 2>&1
          echo "=== /repos/jerryboganda/adcportal/packages ==="; gh api "/repos/jerryboganda/adcportal/packages?package_type=container" --jq '.[].name' 2>&1
          echo "=== try PATCH via curl /user ==="; curl -s -o /dev/null -w "%{http_code}\n" -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"visibility":"public"}' https://api.github.com/user/packages/container/adcportal/visibility
          echo "=== try PATCH via curl /repos ==="; curl -s -o /dev/null -w "%{http_code}\n" -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"visibility":"public"}' https://api.github.com/repos/jerryboganda/adcportal/packages/container/adcportal/visibility
